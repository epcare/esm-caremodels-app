name: Care Models CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - created
env:
  ESM_NAME: "@epcare/esm-caremodels-app"
  JS_NAME: "esm-caremodels-app.js"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - run: yarn verify
      - run: yarn build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist

  pre_release:
    runs-on: ubuntu-latest

    needs: build

    if: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Version
        # run_number is reused when a failed workflow is rerun, while run_attempt
        # increments. Including both keeps every npm version immutable and unique.
        # Yarn 4 takes the version as a positional strategy and never tags or commits.
        run: yarn version --immediate "$(node -e "console.log(require('semver').inc(require('./package.json').version, 'patch'))")-pre.${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Build
        run: yarn build

      - run: git config user.email "<>" && git config user.name "EMR CI"
      - run: git add . && git commit -m "Prerelease version" --no-verify

      - name: Configure npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > .npmrc

      - name: Pre-release
        run: npm publish --access public --tag next

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
          overwrite: true

  release:
    runs-on: ubuntu-latest

    needs: build

    if: ${{ github.event_name == 'release' }}

    steps:
      - uses: actions/checkout@v6
      - name: Download Artifacts
        uses: actions/download-artifact@v8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18.x"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Configure npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > .npmrc

      - run: npm publish
